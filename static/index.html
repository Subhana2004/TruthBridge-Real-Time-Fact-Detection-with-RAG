<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TruthBridge</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="brand" aria-label="TruthBridge">
      <div class="brand-mark">T</div>
      <h1>TruthBridge</h1>
      <p>Real-time fact verification</p>
    </section>

    <section id="results" class="results" aria-live="polite">
      <p id="status">Your transcription and verification result will appear here.</p>
    </section>

    <button id="record-button" class="record-button" type="button">RECORD</button>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
